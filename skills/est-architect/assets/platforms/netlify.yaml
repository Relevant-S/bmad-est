id: netlify
name: Netlify
kind: paas
what: A deployment platform for web frontends with serverless functions beside them. Directly comparable
  to Vercel and, like it, cannot run a worker.
serves:
  web_client:
    service: Netlify (framework build)
    managed: true
    interface: standard
    icon: netlify
    interface_why: A standard framework build; moving off is a redeploy unless the project leaned on
      Netlify-specific edge middleware.
  cdn:
    service: Netlify Edge Network
    managed: true
    interface: standard
    icon: netlify
  edge_protection:
    service: Netlify managed TLS and firewall traffic rules
    managed: true
    interface: proprietary
    icon: shield
  application:
    service: Netlify Functions
    runtime: Netlify Functions
    runtime_why: >
      Serverless functions at the edge.
    managed: true
    interface: proprietary
    icon: netlify
  secrets:
    service: Netlify environment variables
    managed: true
    interface: standard
    icon: key
  ci_cd:
    service: Netlify Git integration (deploy preview per branch)
    managed: true
    interface: proprietary
    icon: netlify
runtime:
  languages:
  - javascript
  - typescript
  - go
  containers: false
  long_running: false
  long_running_why: Functions are request-scoped.
  background_jobs: false
  websockets: false
  scheduled_jobs: true
  native_dependencies: false
  cold_start: true
  max_execution_seconds: null
pricing:
  model: seat_plus_usage
  default_url: https://www.netlify.com/pricing/
volatile:
  regions:
    value: null
    checked: null
    note: Never verified by this installation. NOT evidence of absence — a certification or residency
      gate against this is reported unevaluated. Research it, write the value, the URL and the date.
  certifications:
    value: null
    checked: null
    note: Never verified by this installation. NOT evidence of absence — a certification or residency
      gate against this is reported unevaluated. Research it, write the value, the URL and the date.
  residency:
    value: null
    checked: null
    note: Never verified by this installation. NOT evidence of absence — a certification or residency
      gate against this is reported unevaluated. Research it, write the value, the URL and the date.
