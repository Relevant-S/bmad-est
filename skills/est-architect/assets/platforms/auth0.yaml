id: auth0
name: Auth0
kind: saas
what: Hosted identity. The long-standing alternative to Clerk and Cognito; single-capability, so it
  only appears beside a host.
serves:
  identity:
    service: Auth0
    managed: true
    interface: standard
    icon: auth0
    interface_why: OIDC and SAML, so a migration re-issues tokens rather than rewriting every sign-in
      surface.
