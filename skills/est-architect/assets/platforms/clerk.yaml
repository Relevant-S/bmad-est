id: clerk
name: Clerk
kind: saas
what: >
  Hosted authentication and B2B organisations: sign-up, sessions, MFA, social login, and
  Organizations with roles and permissions. Identity only in this catalogue (Clerk Billing is
  a separate product and is not a substitute for Stripe Billing).

serves:
  identity:
    service: Clerk (auth + orgs)
    managed: true
    interface: proprietary
    interface_why: Proprietary SDKs and UI components; session tokens are standard JWTs, but a migration re-implements the org model and every sign-in surface.
    icon: clerk

runtime: {}

