id: vercel
name: Vercel
kind: paas
what: >
  A deployment platform for web frontends and the serverless functions beside them. Serves
  very few capabilities and serves them with almost no operational surface, which is the whole
  trade: it is the fastest way to ship a web client and it cannot run a worker.

serves:
  web_client:
    service: Vercel (Next.js and other frameworks)
    managed: true
    interface: standard
    interface_why: >
      A standard framework build. Moving off is a redeploy — unless the project has leaned on
      Vercel-specific middleware or image optimisation, which is why the sourcing layer records
      what a component actually uses.
    icon: vercel
  cdn:
    service: Vercel Edge Network
    managed: true
    interface: standard
    icon: vercel
  edge_protection:
    service: Vercel Firewall and managed TLS
    managed: true
    interface: proprietary
    icon: shield
  application:
    service: Vercel Functions
    runtime: Vercel Functions
    runtime_why: >
      Serverless functions at the edge.
    managed: true
    interface: proprietary
    interface_why: >
      Request-scoped handlers with an execution ceiling. Not a general application runtime, and
      the runtime-fit sub-score is where that has to show up rather than in a footnote.
    icon: vercel
  secrets:
    service: Vercel Environment Variables
    managed: true
    interface: standard
    icon: key
  ci_cd:
    service: Vercel Git integration (preview deployment per branch)
    managed: true
    interface: proprietary
    icon: vercel

runtime:
  languages: [javascript, typescript, python, go, ruby]
  containers: false
  long_running: false
  long_running_why: >
    Functions are request-scoped. A component that must hold a process open — a websocket hub,
    a poller, a consumer — does not run here and needs a second platform in the set.
  background_jobs: false
  websockets: false
  scheduled_jobs: true
  scheduled_jobs_why: Cron triggers exist, but each invocation is still a bounded function.
  native_dependencies: false
  cold_start: true
  max_execution_seconds: null
  max_execution_why: >
    Bounded, and the ceiling differs by plan and runtime. NOT written as a number here because
    it moves with the plan; the runtime-fit sub-score treats `long_running: false` as the
    binding fact and that one does not move.

pricing:
  model: seat_plus_usage
  default_url: https://vercel.com/pricing

volatile:
  regions:
    value: null
    checked: null
  certifications:
    value: null
    checked: null
  residency:
    value: null
    checked: null
    note: >
      Edge execution is global by design, which is a residency question rather than an answer.
      A project with a residency gate must have this researched before Vercel is scored.
