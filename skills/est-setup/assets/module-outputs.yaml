# What each est skill writes, and nothing else.
#
# The complaint this answers: "the skills produce too many redundant files; the set of output
# files must be deterministic — same skill, same files, every run." A real workspace had
# 8.5 MB of artefacts for one 237 KB spreadsheet, including a byte-identical `.check.json`
# beside `check.json`, 1.5 MB of subagent findings under names the agent invented that run,
# and another project's backtest sitting in the same folder.
#
# `required` files must exist after a clean run. `optional` files exist under a stated
# condition. Anything else in the workspace is undeclared, and check-outputs.py names it.
#
# Paths are relative to the workspace the skill was pointed at. `{...}` segments match any
# single path segment.

est-scope-extract:
  workspace: "{est_output_folder}/{project-slug}"
  required:
    - path: feature-inventory.json
      role: source of truth
    - path: feature-inventory.md
      role: rendered from the JSON, never edited directly. The index when the inventory is
            grouped into epics, and the whole document when it is not.
    - path: extraction-report.md
      role: coverage, gaps and open questions
    - path: normalized/manifest.json
      role: provenance for the converted sources
    - path: .memlog.md
      role: append-only process record
  optional:
    - path: "inventory/{page}.md"
      when: the inventory is grouped into epics — one page per epic in build sequence, plus
            unassigned.md, implicit.md and standing.md where those exist. Row text inline
            takes a 365-story inventory past 2 MB in one file.
    - path: feature-inventory.csv
      when: csv is in est_output_formats
    - path: feature-inventory.tasks.csv
      when: csv is in est_output_formats. One row per source row, so a task id a story names
            resolves to a row rather than to nothing.
    - path: feature-inventory.xlsx
      when: xlsx is in est_output_formats and openpyxl is importable
    - path: "normalized/S{n}-{stem}.md"
      when: one per converted source
    - path: beats.json
      when: plan-beats.py cut the sources into units of parallel extraction
    - path: "extract/{beat_id}.json"
      when: an extraction subagent wrote its beat to disk instead of returning it
    - path: "review/{source_id}.json"
      when: a review subagent wrote its findings to disk instead of returning them
    - path: check.json
      when: written by est-estimate when it validates this inventory
    - path: feature-inventory.merged.json
      when: mid-update only; promoted over feature-inventory.json and then removed
    - path: feature-inventory.next.json
      when: mid-update only; removed once the merge is promoted
    - path: feature-inventory.prev.json
      when: mid-update only; deleted once the merge is promoted, since git and the memlog
            already hold what it replaced
    - path: normalized/manifest-v2.json
      when: mid-update only; deleted with feature-inventory.prev.json
    - path: confirmation-batch.md
      when: an interactive run produced a batch for a human to accept

est-estimate:
  workspace: "{est_output_folder}/{project-slug}"
  required:
    - path: classification.json
      role: what each story costs to build, keyed by feature id — this skill's judgement,
            kept out of the inventory so a re-extraction cannot revert it
    - path: estimate.json
      role: source of truth
    - path: estimate.md
      role: the document a human reads
  optional:
    - path: estimate.csv
      when: csv is in est_output_formats. The inventory's Stories columns with the priced
            columns appended — every column est-scope-extract wrote is still in it — plus a
            budget block per STORY-CARRYING role ({role}_hours, {role}_risk, {role}_planned)
            that a reader can sum down the sheet. A role priced only at project level — QA is
            a share of the story total, the architect is on the calendar — gets no columns,
            because they would be zero on every story row; its hours are on its own
            "[project] <role>" line, which says so in its description.
    - path: estimate.tasks.csv
      when: csv is in est_output_formats. The inventory's Tasks columns, so a task id a
            story names still resolves to a row, plus the parent story's figures allocated
            down it — every one prefixed alloc_, because they are an allocation and not an
            estimate. Same role rule as the Stories sheet — allocation splits a story's hours,
            so a role that sits on no story allocates to nothing and gets no column.
    - path: estimate.xlsx
      when: xlsx is in est_output_formats and openpyxl is importable. Stories and Tasks on
            two tabs, hyperlinked, the same shape as feature-inventory.xlsx.
    - path: estimate.html
      when: html is in est_output_formats
    - path: estimate-brief.json
      when: brief is in est_output_formats; what est-agent-estimator loads
    - path: check.json
      when: the inventory was validated in this run
    - path: "classify/{epic_id}.json"
      when: a classification subagent wrote its epic to disk instead of returning it
    - path: feature-inventory.json.bak
      when: split-inventory.py migrated an inventory that still carried inline tags;
            delete it once the split estimate has been read
    - path: .memlog.md
      when: shared with est-scope-extract in the same workspace
  also_writes:
    - path: "{memory}/ledger/EST-{date}-{slug}.json"
      role: the reproducible record; never in the workspace
    - path: "{memory}/ledger/index.json"
      role: rebuilt from the entries on every write
    - path: "{memory}/cost-model.json"
      when: first run only, seeded from the module asset

est-plan:
  workspace: "{est_output_folder}/{project-slug}"
  required:
    - path: plan.json
      role: source of truth — every option with its schedule, its staffing decisions and
            its own complete estimate. The estimate is never rewritten; an option's hours
            are that option's, and are labelled as such.
  optional:
    - path: plan.md
      when: the run rendered; the document a human reads
  also_writes:
    - path: estimate.xlsx
      role: extended in place with an Options tab and one Gantt tab per schedule offered.
            est-plan appends to the workbook est-estimate wrote rather than producing a
            second one, so a bar and the story it covers live in the same file.

est-architect:
  workspace: "{est_output_folder}/{project-slug}"
  required:
    - path: architecture.json
      role: source of truth — the three scored layers with the number each sub-score rests on,
            the capability-to-story map, the chosen stack, the sourcing decision per capability
            and the platform set, plus every component with the `serves` that puts it on the
            canvas. Scope is NOT here; the inventory owns that and this file may not contradict
            it.
    - path: architecture.md
      role: the document a human reads
    - path: architecture.png
      role: the infrastructure diagram. REQUIRED, not optional — est-setup provisions the
            renderer and proves it with a fixture render, and a failed render fails the run,
            because a required output that silently goes missing moves the failure to the first
            artefact a client sees.
    - path: diagram.json
      role: the renderer document the PNG was drawn from, kept so a render is reproducible
            without re-deriving it
    - path: diagram.measured.json
      role: the same document after the browser laid it out — final boxes and every connector's
            routed points. This is what makes "no arrow runs over a component" a check rather
            than an impression; routing-check.py reads it, and the first real diagram had
            nineteen crossings nobody could have counted from the PNG.
  optional:
    - path: costs.json
      when: the run priced the architecture. Every row carries its rate, its assumption, a
            verbatim quote from the vendor's pricing page, the URL and the date fetched, so
            cost-check.py can re-fetch and verify each one.
    - path: cost-breakdown.csv
      when: csv is in est_output_formats and costs.json exists
    - path: architecture.html
      when: html is in est_output_formats
    - path: sourcing-batch.md
      when: an interactive run produced a confirmation batch for a human to accept
    - path: architecture-check.json
      when: the audit was written to disk as well as embedded in architecture.json
    - path: cost-check.json
      when: the cost verification was written to disk
    - path: "gate-{layer}.md"
      when: a gate is waiting on the operator — one of gate-stack.md, gate-sourcing.md or
            gate-platform.md. architect.py exits 3 and writes the document the operator reads;
            that is the normal outcome of the first three invocations, not an error.
    - path: "research/{concern}.json"
      when: a research subagent wrote its findings to disk instead of returning them
    - path: stacks.json
      when: the research pass wrote its stack options to the workspace rather than passing them
            inline. An INPUT the operator can edit and re-run against, which is why it is
            declared rather than reported as a stray file.
    - path: candidates.json
      when: as above, for the researched adopt and buy candidates per capability
    - path: rows.json
      when: as above, for the researched cost rows — one per service, each with its rate, its
            verbatim quote, its URL and the date it was fetched
    - path: inputs.json
      when: the operator's answers — platform requirements, procurement position, NFRs and hard
            constraints — written down so a re-run is reproducible rather than re-elicited
  also_writes:
    - path: "{memory}/platforms/{id}.yaml"
      when: a solution was researched and added to the catalogue with profile-scaffold.py. The
            twenty profiles that ship are a starting point, not a boundary; memory merges over
            the shipped assets, so a company extends and overrides without forking the module.
    - path: "{skill-root}/assets/icon-cache/"
      role: official icons resolved on demand from the vendors' own catalogues and cached.
            Not source and not committed — there are 2,693 official cloud SVGs alone and the
            vendors revise them quarterly.
    - path: "{skill-root}/assets/icons.resolved.json"
      role: the audit trail for every icon this installation has fetched — source, id, URL,
            licence and date, so a diagram's iconography can be checked the way its numbers are

est-calibrate:
  workspace: "{output_folder}/calibration/{date}"
  required:
    - path: analysis.json
      role: source of truth for the run
    - path: accuracy-report.md
      role: the document a human reads
    - path: .memlog.md
      role: append-only decision record
  optional:
    - path: backtest.json
      when: proposals existed and the engine was available
    - path: accuracy-report.html
      when: html rendering was requested
    - path: accuracy-brief.json
      when: rendered; what est-agent-estimator loads
    - path: skeleton.json
      when: anchor mode, from anchor-project.py
  also_writes:
    - path: "{memory}/cost-model.json"
      when: a human accepted a proposal
    - path: "{memory}/cost-model.{date}.{n}.bak.json"
      when: the model was written; pruned to the most recent 10
    - path: "{memory}/calibration-log.md"
      role: append-only provenance
    - path: "{memory}/comparables.md"
      when: delivered projects were recorded as anchors

est-agent-estimator:
  workspace: "{est_output_folder}/{project-slug}"
  required: []
  optional:
    - path: normalized/conversation.md
      when: scope was elicited in conversation rather than from a document
    - path: normalized/manifest.json
      when: as above
  also_writes:
    - path: "{memory}/company-profile.md"
      when: the profile was updated in conversation
    - path: "{memory}/comparables.md"
      when: a delivered project was recorded

est-setup:
  workspace: "{project-root}/_bmad"
  required:
    - path: custom/config.toml
      role: the settings layer a reinstall does not regenerate
  optional:
    - path: custom/config.user.toml
      when: a setting was routed to the personal layer
    - path: _config/bmad-help.csv
      when: the module's capabilities were merged into the catalogue
  also_writes:
    - path: "{memory}/cost-model.json"
      role: seeded from est-estimate's asset on a first run, never overwritten after
    - path: "{memory}/company-profile.md"
      role: seeded from est-agent-estimator's asset with every section UNANSWERED, never
            overwritten after — a seeded profile is not a written one
    - path: "{memory}/architecture-model.json"
      role: seeded from est-architect's asset, never overwritten after. Sub-score weights, the
            capability catalogue and the viability gates. Kept out of cost-model.json because
            that file is hour coefficients fitted to delivered actuals and these are neither.
    - path: "{memory}/architecture-preferences.md"
      role: seeded from est-architect's asset with every section UNANSWERED. Until it is
            answered, est-architect's team-fit sub-score reports null rather than a number.
    - path: "{skill-root}/../est-architect/assets/renderer/"
      when: check-renderer.py --install put the pinned diagram CLI here
    - path: "{memory}/comparables.md"
      role: created empty for est-calibrate and Nadia to append to
    - path: "{memory}/calibration-log.md"
      role: created empty; est-calibrate appends every coefficient change to it
    - path: "{memory}/ledger/"
      role: created empty; est-estimate writes one entry per estimate
